# Linker rules (nazariya/entities/linker.py). Reviewable: every rule here changes which links exist.

# Aliases never used, in any language (lowercased / normalised). Longer names always win over
# shorter ones ("Trinamool Congress" beats "Congress"), so only genuinely misleading ones go here.
blocked_aliases:
  - आप        # AAP's Hindi name, but also the everyday pronoun "you"
  - god's own country

