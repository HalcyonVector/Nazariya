# An ambiguous name (several candidates, none also named in full in the article) goes to the most
# prominent candidate only if it has at least this many times the Wikipedia sitelinks of the next.
prominence_ratio: 3.0

# Entity types allowed to keep short (≤ 4 letter) all-caps acronyms, matched case-sensitively.
acronym_types: [party, institution, organisation]
