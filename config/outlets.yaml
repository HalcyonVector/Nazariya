# Candidate outlet registry.
# `hints` are unverified starting points; `python -m nazariya.probe` checks them and
# auto-discovers more (homepage <link rel=alternate>, common paths, robots.txt news sitemaps).
# No editorial-leaning labels here on purpose: outlet groupings must come from the data.
#
# role: outlet    -> analysed and shown on coverage strips
#       reference -> baseline source (government releases, wire agencies), not ranked
# mvp:  true      -> part of the first ~15 sources for weeks 1–2
# user_agent: browser -> CDN rejects any non-browser UA (even an honest 'compatible' one);
#                        robots.txt is still fetched and obeyed for our bot token

outlets:
  # ---------------- National English ----------------
  - id: thehindu
    name: The Hindu
    homepage: https://www.thehindu.com/
    lang: en
    region: national
    role: outlet
    mvp: true
    hints:
      - https://www.thehindu.com/news/national/feeder/default.rss
