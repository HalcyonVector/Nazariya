[project]
name = "nazariya"
version = "0.1.0"
description = "India-focused news coverage analyser"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=2.0",
    "pyyaml>=6.0",
    "lxml>=5.0",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
pg = ["psycopg[binary]>=3.2"]
# the models and the tests: light, no torch
analysis = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.5"]
# embedding as well; install CPU torch first: pip install torch --index-url https://download.pytorch.org/whl/cpu
ml = ["sentence-transformers>=3.0", "numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.5"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nazariya*"]
