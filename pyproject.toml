[project]
name = "nazariya"
version = "0.1.0"
description = "India-focused news coverage analyser"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=2.0",
    "pyyaml>=6.0",
    "lxml>=5.0",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
pg = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nazariya*"]
