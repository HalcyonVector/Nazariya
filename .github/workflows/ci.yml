name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # the tests need the analysis libraries, not the embedding stack (torch is imported lazily)
      - run: pip install -e ".[analysis,dev]"
      - run: pytest -q
