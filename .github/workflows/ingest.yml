name: ingest

on:
  schedule:
    # Every 4 hours. Storage is a SQLite file kept as an encrypted release asset (scripts/state.sh),
    # so there is no database quota; Actions minutes are free for public repositories.
    - cron: "17 */4 * * *"
  workflow_dispatch:

concurrency:
  # one writer of the state file at a time
  group: ingest
  cancel-in-progress: false

permissions:
  contents: write   # upload the encrypted state file to the "state" release
  pages: write
  id-token: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      site_ready: ${{ steps.site.outputs.ready }}
    env:
      DATABASE_URL: sqlite:///data/state.db
      STATE_KEY: ${{ secrets.STATE_KEY }}
      GH_TOKEN: ${{ github.token }}
      HF_HOME: ${{ github.workspace }}/.hf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Require state key
        run: |
          if [ -z "$STATE_KEY" ]; then
            echo "::error::Add a STATE_KEY repository secret (the passphrase that encrypts the state file)"
            exit 1
          fi
      - name: Install
        # CPU-only torch keeps the install small; runners have no GPU
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[ml]"
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .hf
          key: hf-bge-m3-v1
      - name: Pull state
        id: pull
        run: bash scripts/state.sh pull data/state.db state.db.gz.enc
      - name: Import home-PC articles
        # outlets marked `runner: home` block GitHub's IPs; a scheduled task on a home PC ingests
        # them and leaves an encrypted inbox file on the same release
        run: |
          bash scripts/state.sh pull data/home_inbox.jsonl.gz home_inbox.jsonl.gz.enc
          python -m nazariya.inbox import data/home_inbox.jsonl.gz
      - name: Ingest
        run: python -m nazariya.ingest --runner cloud
      - name: Cluster
        # bge-m3 on a CPU runner does about 1 article/s; the cap keeps a run bounded and any
        # backlog carries over to the next run
        run: python -m nazariya.cluster --budget-min 60
      - name: Link entities
        run: python -m nazariya.entities.run
      - name: Predict frames
        run: python -m nazariya.framing.infer
      - name: Update facts
        # small long-lived summaries of each event; the models read these, not raw articles
        run: python -m nazariya.facts
      - name: Models
        run: python -m nazariya.analytics.run
      - name: Export site data
        run: python -m nazariya.export
      - name: Retention
        # raw rows 8 days, article text 3 days; the fact tables are kept
        run: python -m nazariya.retain
      - name: Push state
        # also after a failed step, so articles already ingested are not lost; never if the pull
        # failed (that would overwrite the stored state with an empty file)
        if: always() && steps.pull.outcome == 'success'
        run: |
          python - <<'EOF'
          import sqlite3
          c = sqlite3.connect("data/state.db")
          ok = c.execute("PRAGMA integrity_check").fetchone()[0]
          if ok != "ok":
              raise SystemExit(f"state.db failed its integrity check: {ok}")
          c.execute("VACUUM")
          c.close()
          EOF
          bash scripts/state.sh push data/state.db state.db.gz.enc
          # one rotating daily backup per weekday, so a bad push can be rolled back
          if [ "$(date -u +%H)" -lt 4 ]; then
            bash scripts/state.sh push data/state.db "state-backup-$(date -u +%a).db.gz.enc"
          fi
      - name: Upload site
        if: vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Mark site ready
        id: site
        if: vars.PAGES_ENABLED == 'true'
        run: echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Health check
        # one outlet down is shown on the Sources page as "no data"; only a systemic outage
        # (more than a quarter of cloud outlets down) fails the run
        run: python -m nazariya.health --max-down-share 0.25
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: health-report
          path: reports/health.md
          retention-days: 14

  deploy:
    needs: ingest
    if: always() && vars.PAGES_ENABLED == 'true' && needs.ingest.outputs.site_ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
